site_name: time-safe
site_description: Timelock-encrypt secrets in a GitHub vault and reveal them only after a chosen date (drand/tlock).
site_url: https://louisalexander.github.io/time-safe
repo_url: https://github.com/louisalexander/time-safe
repo_name: louisalexander/time-safe

exclude_docs: |
  superpowers/

theme:
  name: material
  logo: assets/timesafe_github_avatar.png
  favicon: assets/timesafe_github_avatar.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage: usage.md
  - Architecture: architecture.md
  - Security: security.md
