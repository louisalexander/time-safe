[project]
name = "timesafe"
dynamic = ["version"]
description = "Timelock-encrypt secrets in a GitHub vault and reveal them only after a chosen date (drand/tlock)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "keyring>=25",
    "pynacl>=1.5",
]

[project.scripts]
timesafe = "timesafe.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-textual-snapshot>=1.0",
    "wheel>=0.44",
    "uv>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "timesafe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["timesafe"]
# The vendored `tle` binary is gitignored (it's fetched per-target by scripts/build_wheels.py),
# so it must be listed explicitly or hatchling would leave it out of the wheel.
artifacts = ["timesafe/_bin/*"]

[tool.hatch.build.targets.sdist]
# The sdist carries no binary — tle_path() raises a message explaining that when it's missing.
exclude = ["timesafe/_bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
