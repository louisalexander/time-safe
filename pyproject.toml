[project]
name = "timesafe"
version = "0.1.0"
description = "Timelock-encrypt secrets in a GitHub vault and reveal them only after a chosen date (drand/tlock)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "keyring>=25",
    "pynacl>=1.5",
]

[project.scripts]
timesafe = "timesafe.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-textual-snapshot>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timesafe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
