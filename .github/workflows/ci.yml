name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Called by release.yml so the release pipeline gates on exactly this suite, not a copy of it.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q
